name: Run Polus Downloader

on:
  # ⏰ 組織のブロックをすり抜けるため、15分ごとにGitHubが自分で勝手に起動する設定にしました
  schedule:
    - cron: '*/15 * * * *'
  # 予備として、画面から手動で実行ボタンを押せる設定も残しておきます
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Chrome and Selenium
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        pip install selenium

    - name: Run script
      # 🚀 Pythonのプログラム自体に直接新着メールをチェックさせに行きます
      run: python downloader.py
